name: Keyo
options:
  bundleIdPrefix: com.arpit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: YNABR226PF
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Keyo:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/Keyo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.arpit.keyo]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Keyo
        UIAppFonts: [Cinzel.ttf]
        UILaunchScreen:
          UIColorName: LaunchMarble
        NSFaceIDUsageDescription: Approve purchases over your limit.
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
        CFBundleURLTypes:
          - CFBundleURLName: com.arpit.keyo
            CFBundleURLSchemes: [keyo]
        LSApplicationQueriesSchemes: [zcash]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arpit.keyo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: KeyoKeyboard
  KeyoKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    entitlements:
      path: Keyboard/KeyoKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.arpit.keyo]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Keyo
        UIAppFonts: [Cinzel.ttf]
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arpit.keyo.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
